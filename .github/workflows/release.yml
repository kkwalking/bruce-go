name: release

# 发布一个版本 = 推一个 v* tag。
#
#     make tag VERSION=v0.9.0
#     git push origin v0.9.0
#
# 打 tag 前的检查（工作区干净、tag 不重复）由 `make tag` 负责，这里不重复。
on:
  push:
    tags: ["v*"]

# 同一个 tag 重复推（例如删了重推）时取消旧的运行。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# 仓库默认权限是 read，创建 release 需要显式提权。
# 只给 contents: write —— 这个 job 不碰其它任何东西。
permissions:
  contents: write

jobs:
  # 发布前先在 tag 指向的提交上跑一遍测试。
  # tag 可能打在 main 之外的提交上，而 release.yml 不会因为 push 到 main 而触发
  # test.yml，所以这里必须自己验一次，不能假定 CI 已经绿过。
  #
  # 这里刻意对齐 test.yml 的 ubuntu leg，包括 BRUCE_REQUIRE_SANDBOX_TESTS=1：
  # 沙箱测试在后端不可用时默认 skip，不设这个变量的话，发布闸门会在沙箱全挂的
  # 情况下依然放行 —— 那正是 AGENTS.md 说的「用 skip 掩盖环境问题」。
  # 也正因如此必须装 bwrap 并放开 AppArmor 限制，否则严格模式会直接报后端不可用。
  verify:
    name: verify
    runs-on: ubuntu-latest
    env:
      BRUCE_REQUIRE_SANDBOX_TESTS: "1"
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap curl
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

  release:
    name: release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe 需要完整历史与 tag 才能算出正确版本号。
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 版本号从 tag 派生，不手工传，避免 tag 与产物不一致。
      # 这里显式注入 $GITHUB_REF_NAME 之外的来源：make 自己会用 git describe，
      # 而在 tag 上它正好等于这个 tag 的版本。
      - name: Build artifacts
        run: make release-artifacts

      # 产物自检：确认归档里的二进制真的是目标平台、版本号真的是这个 tag。
      # 少了这一步，交叉编译配错（例如 GOARCH 写错）会静默产出能上传但跑不起来的包。
      - name: Verify artifacts
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # 顶层断言：不靠"每个文件看起来都对"，而是先确认产物集合就是这个。
          test -f "dist/checksums.txt"
          expected="bruce_${version}_darwin_arm64.tar.gz bruce_${version}_linux_amd64.tar.gz"
          actual="$(cd dist && ls -1 *.tar.gz | tr '\n' ' ' | sed 's/ $//')"
          test "$actual" = "$expected" \
            || { echo "unexpected archives: got [$actual] want [$expected]"; exit 1; }

          (cd dist && sha256sum -c checksums.txt)

          for platform in darwin/arm64 linux/amd64; do
            os="${platform%/*}"; arch="${platform#*/}"
            archive="dist/bruce_${version}_${os}_${arch}.tar.gz"

            # 归档解开应当是二进制的平铺，不是带外层目录的嵌套。
            tar -tzf "$archive" | grep -qx bruce

            tar -xzf "$archive" -O bruce > /tmp/bruce-check
            chmod +x /tmp/bruce-check

            # GOOS/GOARCH 内嵌在二进制里，比文件名可信。
            info="$(go version -m /tmp/bruce-check)"
            grep -q "GOOS=$os" <<<"$info" \
              || { echo "$archive: not GOOS=$os"; exit 1; }
            grep -q "GOARCH=$arch" <<<"$info" \
              || { echo "$archive: not GOARCH=$arch"; exit 1; }

            # 注入的版本号必须在二进制里。
            # 这是存在性检查，严格程度弱于下面 linux 的实跑：字符串可能来自
            # 依赖而不是 -X 注入。darwin 产物无法在 linux runner 上执行，
            # 所以它只能做到这一步；linux 一侧由实跑兜底。
            grep -a -q -F "$version" /tmp/bruce-check \
              || { echo "$archive: version $version not embedded"; exit 1; }
          done

          echo "artifacts ok for $version"

      # linux 产物直接跑一遍，确认它真能启动（不只是文件格式对）。
      # darwin 产物无法在 ubuntu runner 上执行，由文件名 + GOOS 自检覆盖。
      - name: Smoke test linux binary
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          tar -xzf "dist/bruce_${version}_linux_amd64.tar.gz" -O bruce > /tmp/bruce-smoke
          chmod +x /tmp/bruce-smoke
          got="$(/tmp/bruce-smoke --version)"
          echo "reports: $got"
          test "$got" = "$version" || { echo "want $version, got $got"; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
          echo "released $GITHUB_REF_NAME"
