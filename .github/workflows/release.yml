name: release

# 发布一个版本 = 推一个 v* tag。
#
#     make tag VERSION=v0.9.0
#     git push origin v0.9.0
#
# 打 tag 前的检查（工作区干净、tag 不重复）由 `make tag` 负责，这里不重复。
on:
  push:
    tags: ["v*"]

# 同一个 tag 重复推（例如删了重推）时取消旧的运行。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# 仓库默认权限是 read，创建 release 需要显式提权。
# 只给 contents: write —— 这个 job 不碰其它任何东西。
permissions:
  contents: write

jobs:
  # 发布前先在 tag 指向的提交上跑一遍测试。
  # tag 可能打在 main 之外的提交上，而 release.yml 不会因为 push 到 main 而触发
  # test.yml，所以这里必须自己验一次，不能假定 CI 已经绿过。
  #
  # 这里刻意对齐 test.yml 的 ubuntu leg，包括 BRUCE_REQUIRE_SANDBOX_TESTS=1：
  # 沙箱测试在后端不可用时默认 skip，不设这个变量的话，发布闸门会在沙箱全挂的
  # 情况下依然放行 —— 那正是 AGENTS.md 说的「用 skip 掩盖环境问题」。
  # 也正因如此必须装 bwrap 并放开 AppArmor 限制，否则严格模式会直接报后端不可用。
  verify:
    name: verify
    runs-on: ubuntu-latest
    env:
      BRUCE_REQUIRE_SANDBOX_TESTS: "1"
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap curl
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

  release:
    name: release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe 需要完整历史与 tag 才能算出正确版本号。
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 版本号从 tag 派生，不手工传，避免 tag 与产物不一致。
      - name: Build artifacts
        run: make release-artifacts

      # 产物自检：确认归档里的二进制真的是目标平台、版本号真的是这个 tag。
      # 少了这一步，交叉编译配错（例如 GOARCH 写错）会静默产出能上传但跑不起来的包。
      #
      # 逻辑放在 scripts/ 而不是内联在这里，因为 test.yml 的 release-dry-run job
      # 要在每次 push/PR 上跑同一份脚本 —— 那才是这个脚本能持续被验证的原因。
      - name: Verify artifacts
        run: scripts/verify-release-artifacts.sh dist "${GITHUB_REF_NAME#v}"

      # linux 产物能在这个 runner 上直接执行，上面的 verify 脚本已经实跑过
      # `--version` 并与 tag 比对（darwin 产物无法执行，脚本会退化成仅做检查）。
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
          echo "released $GITHUB_REF_NAME"
