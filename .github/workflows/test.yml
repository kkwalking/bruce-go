name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      # 沙箱后端不可用时失败而不是跳过，避免用 skip 掩盖环境问题。
      BRUCE_REQUIRE_SANDBOX_TESTS: "1"
      GOSUMDB: sum.golang.org

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Linux 的沙箱集成测试要求真实的 bwrap 与 user/PID/mount namespace。
      #
      # ubuntu-latest 现在是 24.04，它通过 AppArmor 限制非特权 user namespace，
      # 于是 bwrap 会以
      #   bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted
      # 失败，沙箱相关测试整体报 "sandbox backend unavailable"。这不是代码问题，
      # 是 runner 的限制：放开这个 sysctl 之后 bwrap 可以正常建立沙箱。
      # 有些内核没有这个开关，所以失败要容忍。
      - name: Install Bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap curl
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

  # main 是唯一长期分支，且用 Makefile 收敛日常命令；构建坏掉应当立刻可见。
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: make build VERSION=ci
      - name: The binary answers
        run: ./bruce --version
